services:
  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: final
    ports:
      - 5088:8080
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
  db:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - db_data:/var/lib/postgresql/
    environment:
      - POSTGRES_DB=books
      - POSTGRES_PASSWORD=Abc.123
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:

